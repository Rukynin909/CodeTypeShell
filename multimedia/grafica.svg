<?xml version="1.0" encoding="UTF-8"?>
<!-- Gráfica provisional (sin leyenda) para el panel de estadísticas.
     Colores = paleta de style.css (hex fijos: un SVG cargado como <img> no ve las variables CSS). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="960" height="160"
     shape-rendering="crispEdges" role="img" aria-hidden="true">
    <!-- Rejilla punteada, como los puntos guía de las stats -->
    <g stroke="#b1b1b1" stroke-width="2" stroke-dasharray="2 6" opacity="0.35">
        <line x1="32" y1="40" x2="944" y2="40"/>
        <line x1="32" y1="80" x2="944" y2="80"/>
        <line x1="32" y1="120" x2="944" y2="120"/>
    </g>

    <!-- Ejes -->
    <g stroke="#b1b1b1" stroke-width="2">
        <line x1="24" y1="16" x2="24" y2="140"/>
        <line x1="24" y1="140" x2="952" y2="140"/>
    </g>

    <!-- Marcas del eje X (cada segundo) -->
    <g fill="#b1b1b1">
        <rect x="31" y="144" width="2" height="4"/><rect x="95" y="144" width="2" height="4"/>
        <rect x="159" y="144" width="2" height="4"/><rect x="223" y="144" width="2" height="4"/>
        <rect x="287" y="144" width="2" height="4"/><rect x="351" y="144" width="2" height="4"/>
        <rect x="415" y="144" width="2" height="4"/><rect x="479" y="144" width="2" height="4"/>
        <rect x="543" y="144" width="2" height="4"/><rect x="607" y="144" width="2" height="4"/>
        <rect x="671" y="144" width="2" height="4"/><rect x="735" y="144" width="2" height="4"/>
        <rect x="799" y="144" width="2" height="4"/><rect x="863" y="144" width="2" height="4"/>
        <rect x="927" y="144" width="2" height="4"/>
    </g>

    <!-- Área bajo la curva -->
    <path fill="#39ff88" opacity="0.08"
          d="M32,120 H96 V96 H160 V88 H224 V80 H288 V84 H352 V72 H416 V68 H480 V76 H544 V64 H608 V60 H672 V64 H736 V56 H800 V52 H864 V60 H928 V48 V140 H32 Z"/>

    <!-- Curva escalonada (estilo pixel/arcade) -->
    <path fill="none" stroke="#39ff88" stroke-width="3" stroke-linejoin="miter"
          d="M32,120 H96 V96 H160 V88 H224 V80 H288 V84 H352 V72 H416 V68 H480 V76 H544 V64 H608 V60 H672 V64 H736 V56 H800 V52 H864 V60 H928 V48"/>

    <!-- Marcas de error (x pixeladas) -->
    <g stroke="#ffffff" stroke-width="2">
        <path d="M284,96 l8,8 M292,96 l-8,8"/>
        <path d="M476,88 l8,8 M484,88 l-8,8"/>
        <path d="M668,76 l8,8 M676,76 l-8,8"/>
        <path d="M860,72 l8,8 M868,72 l-8,8"/>
    </g>

    <!-- Punto final -->
    <rect x="924" y="44" width="8" height="8" fill="#39ff88"/>
</svg>
